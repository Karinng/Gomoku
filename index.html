<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>五子棋 · 人机对战</title>
<style>
  :root {
    --bg: #1d232b;
    --panel: #262e38;
    --text: #eef2f6;
    --muted: #93a1b0;
    --accent: #d9a45b;
    --accent-strong: #f0c27a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
  }

  body {
    background: radial-gradient(circle at 50% 20%, #2b3440, var(--bg) 70%);
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    user-select: none;
  }

  .app {
    display: flex;
    gap: 28px;
    align-items: stretch;
    padding: 24px;
  }

  .board-wrap {
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    line-height: 0;
  }

  canvas {
    display: block;
    width: 720px;
    height: 720px;
    cursor: pointer;
  }

  .panel {
    width: 268px;
    background: var(--panel);
    border-radius: 14px;
    padding: 26px 22px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
  }

  h1 {
    margin: 0;
    font-size: 26px;
    letter-spacing: 4px;
    font-weight: 600;
  }

  .status {
    margin: 0;
    min-height: 48px;
    font-size: 17px;
    line-height: 1.5;
    color: var(--accent-strong);
  }

  label {
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 13px;
    color: var(--muted);
  }

  select {
    appearance: none;
    background: #1b222a;
    color: var(--text);
    border: 1px solid #39434f;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
  }

  select:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  select:focus-visible,
  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .actions {
    display: flex;
    gap: 12px;
    margin-top: auto;
  }

  button {
    flex: 1;
    padding: 12px 10px;
    border: none;
    border-radius: 9px;
    background: var(--accent);
    color: #22180c;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.08s ease, filter 0.15s ease;
  }

  button:hover:not(:disabled) { filter: brightness(1.08); }
  button:active:not(:disabled) { transform: translateY(1px); }

  button:disabled {
    background: #3a434e;
    color: #7c8896;
    cursor: not-allowed;
  }

  .hint {
    margin: 0;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.6;
  }
</style>
</head>
<body>
<main class="app">
  <div class="board-wrap">
    <canvas id="board" aria-label="五子棋棋盘" role="img"></canvas>
  </div>

  <aside class="panel">
    <h1>五子棋</h1>
    <p id="status" class="status"></p>

    <label>难度
      <select id="difficulty">
        <option value="easy">简单</option>
        <option value="normal">普通</option>
        <option value="hard">困难</option>
      </select>
    </label>

    <label>执子
      <select id="side">
        <option value="1">执黑先手</option>
        <option value="2">执白后手</option>
      </select>
    </label>

    <div class="actions">
      <button id="undo" type="button">悔棋</button>
      <button id="restart" type="button">重开</button>
    </div>

    <p class="hint">点击交叉点落子。悔棋会撤销你和电脑对手各一步；对局结束后只能重开。</p>
  </aside>
</main>

<script src="core.js"></script>
<script>
(function () {
  'use strict';

  var SIZE = 720;
  var MARGIN = 42;
  var GRID = (SIZE - MARGIN * 2) / 14;
  var STONE_RADIUS = GRID * 0.42;
  var ANIMATION_MS = 150;
  var PREFS_KEY = 'gomoku-prefs';
  var DIFFICULTIES = ['easy', 'normal', 'hard'];

  var canvas = document.getElementById('board');
  var statusEl = document.getElementById('status');
  var difficultyEl = document.getElementById('difficulty');
  var sideEl = document.getElementById('side');
  var undoBtn = document.getElementById('undo');
  var restartBtn = document.getElementById('restart');
  var ctx = canvas.getContext('2d');

  var dpr = window.devicePixelRatio || 1;
  canvas.width = SIZE * dpr;
  canvas.height = SIZE * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  function loadPrefs() {
    try {
      return JSON.parse(localStorage.getItem(PREFS_KEY)) || {};
    } catch (error) {
      return {};
    }
  }

  var prefs = loadPrefs();
  var game = GomokuCore.createGame({
    humanColor: prefs.humanColor === 2 ? 2 : 1,
    difficulty: DIFFICULTIES.indexOf(prefs.difficulty) >= 0 ? prefs.difficulty : 'normal'
  });

  difficultyEl.value = game.difficulty;
  sideEl.value = String(game.humanColor);

  var animation = null;
  var aiTimer = null;

  function savePrefs() {
    try {
      localStorage.setItem(PREFS_KEY, JSON.stringify({
        difficulty: difficultyEl.value,
        humanColor: Number(sideEl.value)
      }));
    } catch (error) {
      /* 存储不可用时忽略 */
    }
  }

  function centerOf(x, y) {
    return {
      px: MARGIN + x * GRID,
      py: MARGIN + y * GRID
    };
  }

  function drawBoardBackground() {
    var gradient = ctx.createLinearGradient(0, 0, SIZE, SIZE);
    gradient.addColorStop(0, '#e3b772');
    gradient.addColorStop(0.55, '#d5a25c');
    gradient.addColorStop(1, '#c68d46');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, SIZE, SIZE);

    ctx.strokeStyle = 'rgba(96, 62, 30, 0.85)';
    ctx.lineWidth = 1.2;
    for (var i = 0; i < 15; i += 1) {
      var offset = MARGIN + i * GRID;
      ctx.beginPath();
      ctx.moveTo(MARGIN, offset);
      ctx.lineTo(SIZE - MARGIN, offset);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(offset, MARGIN);
      ctx.lineTo(offset, SIZE - MARGIN);
      ctx.stroke();
    }

    ctx.fillStyle = 'rgba(74, 46, 20, 0.9)';
    [3, 7, 11].forEach(function (y) {
      [3, 7, 11].forEach(function (x) {
        var center = centerOf(x, y);
        ctx.beginPath();
        ctx.arc(center.px, center.py, 4, 0, Math.PI * 2);
        ctx.fill();
      });
    });
  }

  function drawStone(x, y, color, scale) {
    var center = centerOf(x, y);
    var radius = STONE_RADIUS * (scale === undefined ? 1 : scale);
    if (radius <= 0) return;

    ctx.save();

    ctx.beginPath();
    ctx.arc(center.px + 2, center.py + 3, radius, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(54, 32, 10, 0.28)';
    ctx.fill();

    var gradient = ctx.createRadialGradient(
      center.px - radius * 0.35,
      center.py - radius * 0.35,
      radius * 0.15,
      center.px,
      center.py,
      radius
    );

    if (color === 1) {
      gradient.addColorStop(0, '#6f6f6f');
      gradient.addColorStop(0.45, '#242424');
      gradient.addColorStop(1, '#050505');
    } else {
      gradient.addColorStop(0, '#ffffff');
      gradient.addColorStop(0.55, '#f1f1f1');
      gradient.addColorStop(1, '#c9c9c9');
    }

    ctx.beginPath();
    ctx.arc(center.px, center.py, radius, 0, Math.PI * 2);
    ctx.fillStyle = gradient;
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = color === 1 ? 'rgba(0, 0, 0, 0.55)' : 'rgba(120, 120, 120, 0.45)';
    ctx.stroke();

    ctx.restore();
  }

  function drawLastMoveMarker(point, color) {
    var center = centerOf(point.x, point.y);
    ctx.beginPath();
    ctx.arc(center.px, center.py, Math.max(3.5, STONE_RADIUS * 0.18), 0, Math.PI * 2);
    ctx.fillStyle = color === 1 ? '#f0c27a' : '#b23a2f';
    ctx.fill();
  }

  function drawWinLine(line) {
    if (!line || line.length < 2) return;
    var start = centerOf(line[0].x, line[0].y);
    var end = centerOf(line[line.length - 1].x, line[line.length - 1].y);

    ctx.save();
    ctx.strokeStyle = 'rgba(226, 68, 55, 0.9)';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.shadowColor = 'rgba(226, 68, 55, 0.55)';
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.moveTo(start.px, start.py);
    ctx.lineTo(end.px, end.py);
    ctx.stroke();
    ctx.restore();
  }

  function currentAnimationScale(x, y, now) {
    if (!animation || animation.x !== x || animation.y !== y) return 1;
    var progress = Math.min(1, (now - animation.start) / ANIMATION_MS);
    var eased = 1 - Math.pow(1 - progress, 3);
    return 0.6 + 0.4 * eased;
  }

  function render() {
    var now = performance.now();
    drawBoardBackground();

    var lastMove = game.lastMove;
    for (var y = 0; y < game.size; y += 1) {
      for (var x = 0; x < game.size; x += 1) {
        var color = game.board.cells[y * game.size + x];
        if (color === 0) continue;
        drawStone(x, y, color, currentAnimationScale(x, y, now));
      }
    }

    if (lastMove) {
      drawLastMoveMarker(lastMove, game.board.cells[lastMove.y * game.size + lastMove.x]);
    }

    if (game.status === 'won' && game.winner) {
      drawWinLine(game.winner.line);
    }
  }

  function isAnimating() {
    return Boolean(animation) && performance.now() - animation.start < ANIMATION_MS;
  }

  function animate(point) {
    if (!point) return;
    animation = { x: point.x, y: point.y, start: performance.now() };
  }

  function updateUi() {
    var humanName = game.humanColor === 1 ? '黑棋' : '白棋';
    var text;

    if (game.status === 'won') {
      text = game.winner && game.winner.color === game.humanColor
        ? '你赢了！'
        : '电脑对手获胜';
    } else if (game.status === 'draw') {
      text = '平局';
    } else if (game.turn === game.humanColor) {
      text = '轮到你落子（' + humanName + '）';
    } else {
      text = '电脑对手思考中…';
    }

    statusEl.textContent = text;

    var canUndo = game.status === 'playing'
      && game.turn === game.humanColor
      && game.history.length >= 2;
    undoBtn.disabled = !canUndo;

    var locked = game.status === 'playing' && game.history.length > 0;
    difficultyEl.disabled = locked;
    sideEl.disabled = locked;
  }

  function scheduleAi() {
    if (game.status !== 'playing' || game.turn === game.humanColor) return;
    window.clearTimeout(aiTimer);
    updateUi();

    aiTimer = window.setTimeout(function () {
      var result = game.aiMove();
      if (result.ok) animate(result.point);
      updateUi();
    }, ANIMATION_MS + 30);
  }

  function restartGame() {
    window.clearTimeout(aiTimer);
    game.restart({
      difficulty: difficultyEl.value,
      humanColor: Number(sideEl.value)
    });
    animation = null;
    savePrefs();
    updateUi();
    scheduleAi();
  }

  canvas.addEventListener('pointerdown', function (event) {
    if (isAnimating()) return;

    var rect = canvas.getBoundingClientRect();
    var px = (event.clientX - rect.left) * (SIZE / rect.width);
    var py = (event.clientY - rect.top) * (SIZE / rect.height);
    var x = Math.round((px - MARGIN) / GRID);
    var y = Math.round((py - MARGIN) / GRID);

    if (x < 0 || x > 14 || y < 0 || y > 14) return;
    var center = centerOf(x, y);
    if (Math.hypot(px - center.px, py - center.py) > GRID * 0.48) return;

    var result = game.humanMove(x, y);
    if (!result.ok) return;

    animate(game.lastMove);
    updateUi();
    scheduleAi();
  });

  undoBtn.addEventListener('click', function () {
    if (game.undo()) {
      animation = null;
      updateUi();
    }
  });

  restartBtn.addEventListener('click', restartGame);

  function onSettingsChange() {
    savePrefs();
    if (game.history.length === 0) {
      restartGame();
    }
  }

  difficultyEl.addEventListener('change', onSettingsChange);
  sideEl.addEventListener('change', onSettingsChange);

  function loop() {
    render();
    window.requestAnimationFrame(loop);
  }

  updateUi();
  window.requestAnimationFrame(loop);
  scheduleAi();
})();
</script>
</body>
</html>
